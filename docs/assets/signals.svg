<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 628" role="img" aria-label="Monarch learns an agent's state from three sources, most trusted first: the agent's own hooks, terminal notifications, and detection rules reading the screen. They resolve to one state per pane: working, blocked, idle, done, error or exited.">
  <style>
    .t{font:600 19px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#a4a8ba}
    .h{font:600 24px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6e8f0}
    .s{font:19px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#a4a8ba}
    .st{font:600 22px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
    .m{font:18px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#a4a8ba}
  </style>
  <rect x=".5" y=".5" width="639" height="627" rx="14" fill="#14151c" stroke="#3a3d4e"/>

  <text class="t" x="36" y="50">Most trusted first</text>
  <path d="M48 72V252" stroke="#3a3d4e" stroke-width="2"/>
  <circle cx="48" cy="90" r="9" fill="#e8761b"/>
  <circle cx="48" cy="164" r="7" fill="#e8761b" opacity=".7"/>
  <circle cx="48" cy="238" r="5" fill="#e8761b" opacity=".45"/>
  <text class="h" x="78" y="90">The agent's own hooks</text>
  <text class="s" x="78" y="118">Claude Code and Codex report as they work.</text>
  <text class="h" x="78" y="164">Terminal notifications</text>
  <text class="s" x="78" y="192">OSC 9, 99 and 777, which agents already send.</text>
  <text class="h" x="78" y="238">The screen</text>
  <text class="s" x="78" y="266">Detection rules for 22 agents read the pane.</text>

  <path d="M36 296H604" stroke="#3a3d4e"/>
  <path d="M320 296V322" stroke="#e8761b" stroke-width="3"/>
  <path d="M320 336l-9-16h18z" fill="#e8761b"/>

  <text class="t" x="36" y="364">One state per pane</text>

  <circle cx="48" cy="400" r="9" fill="#5fafff"/>
  <text class="st" x="78" y="408" fill="#5fafff">Working</text><text class="m" x="190" y="408">busy on your request</text>
  <path d="M48 427l11 12-11 12-11-12z" fill="#c8a000"/>
  <text class="st" x="78" y="447" fill="#c8a000">Blocked</text><text class="m" x="190" y="447">waiting for you</text>
  <circle cx="48" cy="478" r="8" fill="none" stroke="#d0d3e0" stroke-width="3"/>
  <text class="st" x="78" y="486" fill="#d0d3e0">Idle</text><text class="m" x="190" y="486">ready for a request</text>
  <path d="M38 516l7 8 13-15" fill="none" stroke="#2ee65b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="st" x="78" y="525" fill="#2ee65b">Done</text><text class="m" x="190" y="525">finished, not yet seen</text>
  <path d="M40 548l16 16m0-16l-16 16" stroke="#ff5f5f" stroke-width="4" stroke-linecap="round"/>
  <text class="st" x="78" y="564" fill="#ff5f5f">Error</text><text class="m" x="190" y="564">the turn failed</text>
  <rect x="40" y="587" width="16" height="16" fill="#7f8396"/>
  <text class="st" x="78" y="603" fill="#a4a8ba">Exited</text><text class="m" x="190" y="603">the process ended</text>
</svg>
