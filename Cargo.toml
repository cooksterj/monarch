[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cooksterj/monarch"
homepage = "https://github.com/cooksterj/monarch"
authors = ["Jonathan Cook <jon.a.cook7@gmail.com>"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
redundant_clone = "warn"
needless_pass_by_value = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
too_many_arguments = "deny"
too_many_lines = "warn"

[workspace.dependencies]
monarch-core = { package = "monarch-mux-core", path = "crates/monarch-core", version = "0.1.0" }
monarch-proto = { package = "monarch-mux-proto", path = "crates/monarch-proto", version = "0.1.0" }
monarch-term = { package = "monarch-mux-term", path = "crates/monarch-term", version = "0.1.0" }
monarch-detect = { package = "monarch-mux-detect", path = "crates/monarch-detect", version = "0.1.0" }
monarch-server = { package = "monarch-mux-server", path = "crates/monarch-server", version = "0.1.0" }
monarch-tui = { package = "monarch-mux-tui", path = "crates/monarch-tui", version = "0.1.0" }
monarch-cli = { package = "monarch-mux-cli", path = "crates/monarch-cli", version = "0.1.0" }

anyhow = "1"
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
serde_json = "1"
thiserror = "2"
toml = "1.1"
toml_edit = "0.25"
tempfile = "3"
alacritty_terminal = { version = "0.26", default-features = false }
memchr = "2"
bitflags = { version = "2", features = ["serde"] }
portable-pty = "0.9"
proptest = "1"
ratatui = "0.30"
crossterm = "0.29"
insta = "1"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
bytes = "1"
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["codec"] }
rustix = { version = "1.1", default-features = false, features = ["std", "process"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
uuid = { version = "1", features = ["v4"] }
nucleo-matcher = "0.3"
sysinfo = { version = "0.38", default-features = false, features = ["system"] }

[package]
name = "monarch-mux"
description = "An attention-first terminal multiplexer for AI coding agents"
readme = "README.md"
keywords = ["terminal", "tui", "multiplexer", "agents", "ai"]
categories = ["command-line-utilities"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[[bin]]
name = "monarch"
path = "src/main.rs"

[dependencies]
monarch-cli.workspace = true

[lints]
workspace = true

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
