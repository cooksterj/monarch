version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    # Generated by cargo-dist (`dist plan` fails if it is hand-edited);
    # its action versions move when cargo-dist is upgraded.
    exclude-paths:
      - ".github/workflows/release.yml"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
